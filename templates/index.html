<!DOCTYPE html>
<html>
<head>
    <title>Cat vs Dog Classifier</title>
    <style>
        body {
            font-family: Arial;
            background: #f4f4f4;
            text-align: center;
            padding: 40px;
        }
        .container {
            background: white;
            padding: 30px;
            width: 420px;
            margin: auto;
            border-radius: 10px;
        }
        img {
            max-width: 100%;
            margin-top: 15px;
            border-radius: 6px;
        }
        .result {
            font-size: 20px;
            margin-top: 15px;
            font-weight: bold;
        }
        button {
            margin-top: 15px;
            padding: 10px 20px;
            background: #ff7f50;
            border: none;
            color: white;
            border-radius: 6px;
            cursor: pointer;
        }
    </style>
</head>

<body>
<div class="container">
    <h2>Cat vs Dog Image Classifier</h2>

    <form method="POST" enctype="multipart/form-data">
        <input type="file" name="file" accept="image/*" required
               onchange="previewImage(event)">
        <br>
        <img id="preview">
        <br>
        <button type="submit">Predict</button>
    </form>

    {% if prediction %}
        <div class="result">
            Prediction: {{ prediction }} <br>
            Confidence: {{ confidence }}
        </div>
    {% endif %}
</div>

<script>
function previewImage(event) {
    document.getElementById("preview").src =
        URL.createObjectURL(event.target.files[0]);
}
</script>
</body>
</html>
