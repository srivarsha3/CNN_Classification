
<!DOCTYPE html>
<html>
<head>
    <title>Cat vs Dog Classifier</title>
</head>
<body>
    <h2>Upload an Image</h2>
    <form action="/" method="POST" enctype="multipart/form-data">
        <input type="file" name="file" required>
        <input type="submit" value="Predict">
    </form>

    {% if prediction %}
        <h3>Prediction: {{ prediction }}</h3>
    {% endif %}
</body>
</html>
